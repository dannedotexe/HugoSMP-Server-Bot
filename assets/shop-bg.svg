<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2148"/>
      <stop offset=".35" stop-color="#5b3d6e"/>
      <stop offset=".58" stop-color="#a86476"/>
      <stop offset=".7" stop-color="#e39560"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a62"/>
      <stop offset="1" stop-color="#8a6538"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1120" cy="520" r="220" fill="url(#glow)" opacity=".55"/>
  <rect x="1080" y="480" width="80" height="80" fill="#ffe2a6" opacity=".9"/>

  <!-- clouds: flat blocky slabs -->
  <g fill="#f3e6ef" opacity=".55">
    <polygon points="430,40 640,40 600,90 390,90"/>
    <polygon points="760,140 980,140 940,190 720,190"/>
    <polygon points="1210,120 1470,120 1420,175 1160,175"/>
    <polygon points="1060,210 1240,210 1200,250 1020,250"/>
    <polygon points="1360,240 1560,240 1520,280 1320,280"/>
    <polygon points="140,170 300,170 270,205 110,205"/>
  </g>
  <g fill="#c9b3c8" opacity=".5">
    <polygon points="390,90 600,90 600,104 390,104"/>
    <polygon points="720,190 940,190 940,204 720,204"/>
    <polygon points="1160,175 1420,175 1420,190 1160,190"/>
    <polygon points="1020,250 1200,250 1200,262 1020,262"/>
    <polygon points="1320,280 1520,280 1520,292 1320,292"/>
  </g>

  <!-- far mesas -->
  <g fill="#8c5a52" opacity=".8">
    <rect x="0" y="540" width="260" height="60"/>
    <rect x="40" y="510" width="160" height="30"/>
    <rect x="1240" y="530" width="360" height="70"/>
    <rect x="1300" y="500" width="200" height="30"/>
    <rect x="1350" y="470" width="80" height="30"/>
    <rect x="1420" y="440" width="34" height="60"/>
  </g>

  <!-- stepped pyramid -->
  <g>
    <rect x="160" y="300" width="80" height="40" fill="#d8b680"/>
    <rect x="120" y="340" width="160" height="40" fill="#cfab74"/>
    <rect x="80" y="380" width="240" height="40" fill="#c6a068"/>
    <rect x="40" y="420" width="320" height="40" fill="#bc955d"/>
    <rect x="0" y="460" width="400" height="40" fill="#b28b54"/>
    <rect x="-40" y="500" width="480" height="40" fill="#a8814b"/>
    <rect x="-80" y="540" width="560" height="60" fill="#9e7843"/>
    <rect x="290" y="380" width="30" height="220" fill="#000" opacity=".12"/>
    <rect x="180" y="470" width="40" height="60" fill="#3b2a1c"/>
  </g>

  <!-- temple -->
  <g>
    <rect x="560" y="430" width="220" height="170" fill="#c9a46c"/>
    <rect x="540" y="410" width="260" height="24" fill="#d6b47c"/>
    <rect x="600" y="470" width="30" height="50" fill="#6b4a2c"/>
    <rect x="710" y="470" width="30" height="50" fill="#6b4a2c"/>
    <rect x="640" y="520" width="60" height="80" fill="#3d2a1a"/>
    <rect x="610" y="440" width="12" height="12" fill="#b8492f"/>
    <rect x="720" y="440" width="12" height="12" fill="#b8492f"/>
  </g>

  <!-- water -->
  <rect x="0" y="598" width="1600" height="14" fill="#4f7fb2" opacity=".85"/>
  <rect x="0" y="612" width="1600" height="6" fill="#3b6491" opacity=".85"/>

  <!-- ground -->
  <rect x="0" y="618" width="1600" height="282" fill="url(#sand)"/>
  <g fill="#d7ad72" opacity=".55">
    <rect x="0" y="640" width="420" height="20"/>
    <rect x="520" y="680" width="360" height="20"/>
    <rect x="1000" y="650" width="600" height="20"/>
    <rect x="200" y="760" width="460" height="24"/>
    <rect x="900" y="800" width="520" height="24"/>
  </g>
  <g fill="#6f4f2a" opacity=".35">
    <rect x="0" y="840" width="1600" height="60"/>
  </g>

  <!-- cacti -->
  <g>
    <g transform="translate(1440 480)">
      <rect width="70" height="200" fill="#3e7a2f"/>
      <rect x="10" width="8" height="200" fill="#2d5e21"/>
      <rect x="40" width="8" height="200" fill="#2d5e21"/>
      <rect y="0" width="70" height="10" fill="#57983f"/>
    </g>
    <g transform="translate(1260 560)">
      <rect width="46" height="120" fill="#3e7a2f"/>
      <rect x="8" width="6" height="120" fill="#2d5e21"/>
      <rect x="28" width="6" height="120" fill="#2d5e21"/>
    </g>
    <g transform="translate(470 520)">
      <rect width="40" height="100" fill="#3e7a2f"/>
      <rect x="8" width="6" height="100" fill="#2d5e21"/>
      <rect x="24" width="6" height="100" fill="#2d5e21"/>
    </g>
    <g transform="translate(860 560)">
      <rect width="30" height="70" fill="#3e7a2f"/>
      <rect x="6" width="5" height="70" fill="#2d5e21"/>
      <rect x="18" width="5" height="70" fill="#2d5e21"/>
    </g>
    <g transform="translate(60 700)">
      <rect width="180" height="200" fill="#356b28"/>
      <rect x="20" width="16" height="200" fill="#25501b"/>
      <rect x="80" width="16" height="200" fill="#25501b"/>
      <rect x="140" width="16" height="200" fill="#25501b"/>
      <rect width="180" height="18" fill="#4f8f38"/>
    </g>
  </g>

  <!-- dead bushes -->
  <g fill="none" stroke="#5a3a1e" stroke-width="5" opacity=".8">
    <path d="M1100 700 l-20 -30 M1100 700 l18 -34 M1100 700 l0 -40"/>
    <path d="M1360 760 l-24 -34 M1360 760 l22 -38 M1360 760 l2 -46"/>
    <path d="M760 740 l-16 -24 M760 740 l14 -26"/>
  </g>
</svg>
