<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Discord Login – HugoSMP Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>html,body{margin:0;background:#05020a;overflow:hidden}#status{display:none}</style>
</head>
<body style="margin:0;background:#05020a;overflow:hidden">
<script>
async function run(){
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const token = hash.get("access_token");
  if(!token){ window.location.replace("/"); return; }
  try {
    localStorage.setItem("hugosmp_discord_token", token);
    const res = await fetch("https://discord.com/api/users/@me", {
      headers: { Authorization: "Bearer " + token }
    });
    if(!res.ok) throw new Error("Discord API Fehler");
    const user = await res.json();
    localStorage.setItem("hugosmp_discord_user", JSON.stringify(user));
    window.location.replace("/?page=cart");
  } catch(e) {
    console.error(e);
    window.location.replace("/");
  }
}
run();
</script>
</body>
</html>
