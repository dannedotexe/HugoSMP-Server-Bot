<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugoSMP Bot Dashboard</title>
  <link rel="icon" href="/assets/dashboard-icon.jpg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #141b23;
      --panel-2: #19232d;
      --panel-3: #101720;
      --line: #2b3847;
      --text: #edf2f7;
      --muted: #94a3b8;
      --accent: #33c481;
      --accent-2: #4ea1ff;
      --danger: #ef5c5c;
      --warning: #f2b84b;
      --shadow: 0 18px 60px rgba(0, 0, 0, .35);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #1d2935;
      color: var(--text);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #52677d; }
    button.primary { background: var(--accent); color: #08130e; border-color: var(--accent); font-weight: 700; }
    button.ghost { background: transparent; }
    button.danger { background: #321b20; border-color: #5d2931; color: #ffb4bf; }
    button.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #0f151c;
      color: var(--text);
      border-radius: 6px;
      padding: 10px 12px;
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--accent-2); }
    input[type="file"] { padding: 8px; color: var(--muted); }
    textarea { resize: vertical; min-height: 96px; }

    .hidden { display: none !important; }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-box {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .login-box p {
      color: var(--muted);
      margin: 0 0 18px;
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-3);
      padding: 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: block;
      object-fit: cover;
      border: 1px solid #3b4c60;
      background: #0b1017;
    }

    .brand strong { display: block; line-height: 1.1; }
    .brand span { color: var(--muted); font-size: 13px; }

    .layout {
      height: calc(100vh - 58px);
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr) 310px;
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .sidebar-head {
      padding: 14px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .split {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .split h2 {
      margin: 0;
      font-size: 16px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .filter-row button {
      min-height: 32px;
      padding: 0 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .filter-row button.active {
      color: #08130e;
      border-color: var(--accent);
      background: var(--accent);
      font-weight: 800;
    }

    .new-dm {
      display: grid;
      gap: 8px;
      padding-top: 6px;
    }

    .selected-files {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .thread-list {
      overflow: auto;
      padding: 8px;
    }

    .thread {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      min-height: 64px;
      padding: 8px;
      border-radius: 6px;
    }

    .thread:hover, .thread.active {
      background: var(--panel-2);
      border-color: var(--line);
    }

    .thread.archived {
      opacity: .78;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #263444;
      object-fit: cover;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .thread-main { min-width: 0; }

    .thread-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
    }

    .thread-last {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .thread-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .tiny-tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 7px;
      line-height: 1.2;
    }

    .tiny-tag.good { color: #a7f3c8; border-color: #2c694e; }
    .tiny-tag.warn { color: #ffd486; border-color: #73501d; }

    .badge {
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--warning);
      color: #140d02;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      padding: 0 6px;
    }

    .conversation {
      min-width: 0;
      display: grid;
      grid-template-rows: 66px minmax(0, 1fr) auto;
      background: #0f141b;
    }

    .conversation-head {
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      min-width: 0;
    }

    .user-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .user-title strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .messages {
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }

    .bubble {
      max-width: min(680px, 84%);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.in {
      align-self: flex-start;
      background: #17212c;
    }

    .bubble.out {
      align-self: flex-end;
      background: #13271f;
      border-color: #24553f;
    }

    .bubble-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .message-content {
      white-space: normal;
      line-height: 1.42;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      margin: 0 0 8px;
      line-height: 1.15;
      font-weight: 800;
    }

    .message-content h1 { font-size: 24px; }
    .message-content h2 { font-size: 20px; }
    .message-content h3 { font-size: 17px; }

    .message-content strong { font-weight: 800; }
    .message-content em { font-style: italic; }
    .message-content u { text-underline-offset: 2px; }
    .message-content a { color: #9dccff; text-decoration: none; }

    .message-content blockquote {
      margin: 4px 0;
      padding: 2px 0 2px 10px;
      border-left: 3px solid #52677d;
      color: #cbd5e1;
    }

    .message-content .md-list {
      padding-left: 16px;
      text-indent: -10px;
    }

    .message-content pre {
      margin: 6px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0b1017;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .message-content code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: .92em;
    }

    .message-content .md-inline-code {
      padding: 1px 5px;
      border-radius: 4px;
      background: #0b1017;
      border: 1px solid var(--line);
    }

    .message-content .md-spoiler {
      border-radius: 3px;
      background: #263444;
      color: transparent;
      padding: 0 3px;
      transition: color .12s ease;
    }

    .message-content .md-spoiler:hover {
      color: var(--text);
    }

    .attachments {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .attachments a {
      color: #9dccff;
      text-decoration: none;
      font-size: 13px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      background: var(--panel-3);
    }

    .reply-stack {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .info-panel {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
    }

    .info-panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .info-card {
      display: grid;
      gap: 14px;
    }

    .info-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101720;
      padding: 12px;
    }

    .info-section h3 {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .info-row strong {
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .role-list, .warning-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .role-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .warning-item {
      width: 100%;
      border: 1px solid #5d2931;
      border-radius: 6px;
      padding: 7px 8px;
      color: #ffc4cb;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 10px 12px;
      background: #1c2631;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      color: var(--text);
      max-width: min(420px, calc(100vw - 32px));
      z-index: 10;
    }

    .toast.error { border-color: #6c2931; color: #ffc4cb; }

    @media (max-width: 1120px) {
      .layout {
        grid-template-columns: 320px minmax(0, 1fr);
      }

      .info-panel {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: 360px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        height: auto;
        min-height: 58px;
        align-items: flex-start;
        padding: 12px;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 58px);
      }

      .sidebar {
        min-height: 390px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .conversation {
        min-height: 560px;
      }

      .conversation-head, .composer {
        grid-template-columns: 1fr;
      }

      .conversation-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .head-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <section id="loginView" class="login-shell hidden">
    <form id="loginForm" class="login-box">
      <h1>Bot Dashboard</h1>
      <p id="loginHint">Login mit dem Railway-Dashboard-Passwort.</p>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Passwort">
      <div style="height: 12px"></div>
      <button class="primary" type="submit">Einloggen</button>
    </form>
  </section>

  <section id="appView" class="hidden">
    <header class="topbar">
      <div class="brand">
        <img class="mark" src="/assets/dashboard-icon.jpg" alt="">
        <div>
          <strong>HugoSMP Bot Dashboard</strong>
          <span id="botName">Bot startet...</span>
        </div>
      </div>
      <button id="logoutBtn" class="ghost" type="button">Logout</button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="split">
            <h2>DMs</h2>
            <button id="refreshBtn" class="small" type="button">Refresh</button>
          </div>
          <input id="threadSearch" type="search" placeholder="User-ID oder Name suchen">
          <div class="filter-row" aria-label="DM-Filter">
            <button class="active" data-filter="active" type="button">Alle</button>
            <button data-filter="unread" type="button">Ungelesen</button>
            <button data-filter="answered" type="button">Beantwortet</button>
            <button data-filter="archived" type="button">Archiviert</button>
          </div>
          <div class="new-dm">
            <input id="newUserId" inputmode="numeric" placeholder="Discord User-ID">
            <textarea id="newMessage" placeholder="Neue DM schreiben"></textarea>
            <input id="newFiles" type="file" multiple>
            <div id="newFileList" class="selected-files"></div>
            <button id="newSendBtn" class="primary" type="button">Neue DM senden</button>
          </div>
        </div>
        <div id="threadList" class="thread-list"></div>
      </aside>

      <section class="conversation">
        <div class="conversation-head">
          <div class="user-title">
            <div id="selectedAvatar" class="avatar">?</div>
            <div>
              <strong id="selectedName">Kein Thread ausgewählt</strong>
              <span id="selectedId">User-ID</span>
            </div>
          </div>
          <div class="head-actions">
            <button id="copyIdBtn" class="small" type="button" disabled>User-ID kopieren</button>
            <button id="archiveBtn" class="small" type="button" disabled>Archivieren</button>
            <button id="deleteThreadBtn" class="small danger" type="button" disabled>Löschen</button>
          </div>
        </div>
        <div id="messages" class="messages">
          <div class="empty">Wähle links einen DM-Thread aus.</div>
        </div>
        <div class="composer">
          <div class="reply-stack">
            <textarea id="replyText" placeholder="Antwort schreiben" disabled></textarea>
            <input id="replyFiles" type="file" multiple disabled>
            <div id="replyFileList" class="selected-files"></div>
          </div>
          <button id="replyBtn" class="primary" type="button" disabled>Senden</button>
        </div>
      </section>

      <aside class="info-panel">
        <h2>User-Info</h2>
        <div id="userInfo" class="empty">Kein User ausgewählt.</div>
      </aside>
    </main>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script>
    const MAX_FILES = 5;
    const MAX_FILE_BYTES = 8 * 1024 * 1024;
    const MAX_TOTAL_BYTES = 12 * 1024 * 1024;

    const state = {
      token: localStorage.getItem('hugoDmDashboardToken') || '',
      threads: [],
      selectedUserId: null,
      selectedThread: null,
      filter: 'active',
      search: ''
    };

    const $ = id => document.getElementById(id);

    function showToast(message, isError = false) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3200);
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      if (!options.noAuth && state.token) headers.Authorization = `Bearer ${state.token}`;

      const response = await fetch(path, {
        ...options,
        headers,
        body: options.body && typeof options.body !== 'string'
          ? JSON.stringify(options.body)
          : options.body
      });

      const data = await response.json().catch(() => ({ success: false, error: 'Server-Antwort war ungültig.' }));
      if (!response.ok || data.success === false) {
        const error = new Error(data.error || 'Anfrage fehlgeschlagen.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function formatTime(value, withDate = false) {
      if (!value) return '-';
      return new Intl.DateTimeFormat('de-AT', {
        day: '2-digit',
        month: '2-digit',
        year: withDate ? 'numeric' : undefined,
        hour: '2-digit',
        minute: '2-digit'
      }).format(new Date(value));
    }

    function preview(thread) {
      const last = thread.lastMessage;
      if (!last) return 'Noch keine Nachrichten';
      if (last.content) return last.content;
      if (last.attachments?.length) return `${last.attachments.length} Anhang`;
      return 'Nachricht';
    }

    function avatarNode(thread) {
      if (thread?.avatarUrl) {
        const img = document.createElement('img');
        img.className = 'avatar';
        img.src = thread.avatarUrl;
        img.alt = '';
        return img;
      }

      const div = document.createElement('div');
      div.className = 'avatar';
      div.textContent = (thread?.username || thread?.userId || '?').slice(0, 1).toUpperCase();
      return div;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function restoreMarkdownPlaceholders(html, placeholders) {
      return html.replace(/\uE000(\d+)\uE001/g, (_, index) => placeholders[Number(index)] || '');
    }

    function renderDiscordInline(line, stash) {
      let html = line.replace(/`([^`\n]+)`/g, (_, code) => (
        stash(`<code class="md-inline-code">${code}</code>`)
      ));

      html = html
        .replace(/\|\|(.+?)\|\|/g, '<span class="md-spoiler">$1</span>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/__(.+?)__/g, '<u>$1</u>')
        .replace(/~~(.+?)~~/g, '<s>$1</s>')
        .replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
        .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>')
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');

      return html;
    }

    function renderMarkdownLine(line, stash) {
      if (/^\uE000\d+\uE001$/.test(line)) return line;

      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) {
        const level = heading[1].length;
        return `<h${level}>${renderDiscordInline(heading[2], stash)}</h${level}>`;
      }

      const quote = line.match(/^&gt;\s?(.*)$/);
      if (quote) return `<blockquote>${renderDiscordInline(quote[1], stash)}</blockquote>`;

      const list = line.match(/^[-*]\s+(.+)$/);
      if (list) return `<div class="md-list">• ${renderDiscordInline(list[1], stash)}</div>`;

      return renderDiscordInline(line, stash);
    }

    function renderDiscordMarkdown(content) {
      const placeholders = [];
      const stash = html => {
        const token = `\uE000${placeholders.length}\uE001`;
        placeholders.push(html);
        return token;
      };

      let source = escapeHtml(content).replace(/\r\n/g, '\n');
      source = source.replace(/```(?:[a-z0-9_-]+)?\n?([\s\S]*?)```/gi, (_, code) => (
        stash(`<pre><code>${code.replace(/^\n|\n$/g, '')}</code></pre>`)
      ));

      const html = source
        .split('\n')
        .map(line => renderMarkdownLine(line, stash))
        .join('<br>');

      return restoreMarkdownPlaceholders(html, placeholders);
    }

    function setActionButtons(thread) {
      $('copyIdBtn').disabled = !thread;
      $('archiveBtn').disabled = !thread;
      $('deleteThreadBtn').disabled = !thread;
      $('replyText').disabled = !thread;
      $('replyFiles').disabled = !thread;
      $('replyBtn').disabled = !thread;
      $('archiveBtn').textContent = thread?.archived ? 'Wiederherstellen' : 'Archivieren';
    }

    function renderThreads() {
      const list = $('threadList');
      list.replaceChildren();

      if (!state.threads.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = state.search ? 'Keine passenden DMs gefunden.' : 'Noch keine DMs gespeichert.';
        list.appendChild(empty);
        return;
      }

      state.threads.forEach(thread => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `thread${thread.userId === state.selectedUserId ? ' active' : ''}${thread.archived ? ' archived' : ''}`;
        button.addEventListener('click', () => selectThread(thread.userId));

        const main = document.createElement('div');
        main.className = 'thread-main';

        const name = document.createElement('div');
        name.className = 'thread-name';
        name.textContent = thread.globalName || thread.username || thread.userId;

        const last = document.createElement('div');
        last.className = 'thread-last';
        last.textContent = preview(thread);

        const tags = document.createElement('div');
        tags.className = 'thread-tags';

        if (thread.answered) {
          const answered = document.createElement('span');
          answered.className = 'tiny-tag good';
          answered.textContent = 'beantwortet';
          tags.appendChild(answered);
        }

        if (thread.archived) {
          const archived = document.createElement('span');
          archived.className = 'tiny-tag';
          archived.textContent = 'archiviert';
          tags.appendChild(archived);
        }

        if (thread.unreadCount > 0) {
          const unread = document.createElement('span');
          unread.className = 'tiny-tag warn';
          unread.textContent = 'ungelesen';
          tags.appendChild(unread);
        }

        main.append(name, last);
        if (tags.childElementCount) main.appendChild(tags);
        button.append(avatarNode(thread), main);

        if (thread.unreadCount > 0) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = String(thread.unreadCount);
          button.appendChild(badge);
        }

        list.appendChild(button);
      });
    }

    function setSelectedHeader(thread) {
      state.selectedThread = thread || null;
      $('selectedName').textContent = thread ? (thread.globalName || thread.username || thread.userId) : 'Kein Thread ausgewählt';
      $('selectedId').textContent = thread ? thread.userId : 'User-ID';
      setActionButtons(thread);

      const holder = $('selectedAvatar');
      const parent = holder.parentElement;
      const next = avatarNode(thread || { username: '?' });
      next.id = 'selectedAvatar';
      parent.replaceChild(next, holder);
    }

    function renderMessages(thread) {
      const box = $('messages');
      box.replaceChildren();

      if (!thread?.messages?.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = thread ? 'Keine Nachrichten in diesem Thread.' : 'Wähle links einen DM-Thread aus.';
        box.appendChild(empty);
        return;
      }

      thread.messages.forEach(message => {
        const bubble = document.createElement('div');
        bubble.className = `bubble ${message.direction === 'out' ? 'out' : 'in'}`;

        if (message.content) {
          const content = document.createElement('div');
          content.className = 'message-content';
          content.innerHTML = renderDiscordMarkdown(message.content);
          bubble.appendChild(content);
        }

        if (message.attachments?.length) {
          const links = document.createElement('div');
          links.className = 'attachments';
          message.attachments.forEach(file => {
            const link = document.createElement('a');
            link.href = file.url;
            link.target = '_blank';
            link.rel = 'noreferrer';
            link.textContent = file.name || 'Anhang';
            links.appendChild(link);
          });
          bubble.appendChild(links);
        }

        const meta = document.createElement('div');
        meta.className = 'bubble-meta';
        meta.textContent = `${message.direction === 'out' ? 'Bot' : 'User'} - ${formatTime(message.timestamp)}`;
        bubble.appendChild(meta);
        box.appendChild(bubble);
      });

      box.scrollTop = box.scrollHeight;
    }

    function renderUserInfo(info) {
      const box = $('userInfo');
      box.className = info ? 'info-card' : 'empty';
      box.replaceChildren();

      if (!info) {
        box.textContent = 'Kein User ausgewählt.';
        return;
      }

      const overview = document.createElement('section');
      overview.className = 'info-section';
      overview.append(sectionTitle('Übersicht'));
      overview.append(infoRow('Server', info.inGuild ? 'auf dem Server' : 'nicht auf dem Server'));
      overview.append(infoRow('Join-Datum', info.joinedAt ? formatTime(info.joinedAt, true) : '-'));
      overview.append(infoRow('Account', info.createdAt ? formatTime(info.createdAt, true) : '-'));
      overview.append(infoRow('Invites', String(info.invites || 0)));
      overview.append(infoRow('Warnungen', String(info.warningsCount || 0)));

      const roles = document.createElement('section');
      roles.className = 'info-section';
      roles.append(sectionTitle('Rollen'));
      const roleList = document.createElement('div');
      roleList.className = 'role-list';
      if (info.roles?.length) {
        info.roles.forEach(role => {
          const chip = document.createElement('span');
          chip.className = 'role-chip';
          chip.textContent = role.name;
          if (role.color) chip.style.borderColor = role.color;
          roleList.appendChild(chip);
        });
      } else {
        roleList.textContent = 'Keine Rollen gefunden.';
        roleList.style.color = 'var(--muted)';
        roleList.style.fontSize = '13px';
      }
      roles.appendChild(roleList);

      const warnings = document.createElement('section');
      warnings.className = 'info-section';
      warnings.append(sectionTitle('Letzte Warnungen'));
      const warningList = document.createElement('div');
      warningList.className = 'warning-list';
      if (info.warnings?.length) {
        info.warnings.forEach(warning => {
          const item = document.createElement('div');
          item.className = 'warning-item';
          item.textContent = `#${warning.number}: ${warning.reason} - ${formatTime(warning.timestamp, true)}`;
          warningList.appendChild(item);
        });
      } else {
        warningList.textContent = 'Keine Warnungen.';
        warningList.style.color = 'var(--muted)';
        warningList.style.fontSize = '13px';
      }
      warnings.appendChild(warningList);

      box.append(overview, roles, warnings);
    }

    function sectionTitle(text) {
      const title = document.createElement('h3');
      title.textContent = text;
      return title;
    }

    function infoRow(label, value) {
      const row = document.createElement('div');
      row.className = 'info-row';
      const left = document.createElement('span');
      left.textContent = label;
      const right = document.createElement('strong');
      right.textContent = value;
      row.append(left, right);
      return row;
    }

    function clearSelection() {
      state.selectedUserId = null;
      state.selectedThread = null;
      setSelectedHeader(null);
      renderMessages(null);
      renderUserInfo(null);
      $('replyText').value = '';
      $('replyFiles').value = '';
      updateFileList('replyFiles', 'replyFileList');
    }

    async function loadThreads() {
      const params = new URLSearchParams();
      params.set('filter', state.filter);
      if (state.search) params.set('search', state.search);

      const data = await api(`/api/dashboard/threads?${params.toString()}`);
      state.threads = data.threads || [];
      renderThreads();
    }

    async function refreshDashboard() {
      await loadThreads();
      if (!state.selectedUserId) return;

      try {
        const data = await api(`/api/dashboard/threads/${encodeURIComponent(state.selectedUserId)}`);
        setSelectedHeader(data.thread);
        renderMessages(data.thread);
        renderUserInfo(data.thread?.userInfo);
      } catch (error) {
        if (error.status === 404) {
          clearSelection();
          await loadThreads();
          return;
        }
        throw error;
      }
    }

    async function selectThread(userId) {
      state.selectedUserId = userId;
      renderThreads();
      const data = await api(`/api/dashboard/threads/${encodeURIComponent(userId)}`);
      setSelectedHeader(data.thread);
      renderMessages(data.thread);
      renderUserInfo(data.thread?.userInfo);
      await loadThreads();
    }

    function updateFileList(inputId, targetId) {
      const files = Array.from($(inputId).files || []);
      const target = $(targetId);
      if (!files.length) {
        target.textContent = '';
        return;
      }

      target.textContent = files
        .slice(0, MAX_FILES)
        .map(file => `${file.name} (${Math.ceil(file.size / 1024)} KB)`)
        .join(', ');
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          name: file.name,
          contentType: file.type || null,
          data: reader.result
        });
        reader.onerror = () => reject(new Error(`${file.name} konnte nicht gelesen werden.`));
        reader.readAsDataURL(file);
      });
    }

    async function readAttachments(inputId) {
      const files = Array.from($(inputId).files || []);
      if (!files.length) return [];
      if (files.length > MAX_FILES) throw new Error(`Maximal ${MAX_FILES} Anhänge pro Nachricht.`);

      let total = 0;
      for (const file of files) {
        if (file.size > MAX_FILE_BYTES) throw new Error(`${file.name} ist größer als 8 MB.`);
        total += file.size;
      }
      if (total > MAX_TOTAL_BYTES) throw new Error('Die Anhänge sind zusammen größer als 12 MB.');

      return Promise.all(files.map(readFileAsDataUrl));
    }

    async function sendReply() {
      if (!state.selectedUserId) return;
      const content = $('replyText').value.trim();
      const attachments = await readAttachments('replyFiles');
      if (!content && !attachments.length) return;

      $('replyBtn').disabled = true;
      try {
        const data = await api(`/api/dashboard/threads/${encodeURIComponent(state.selectedUserId)}/messages`, {
          method: 'POST',
          body: { content, attachments }
        });
        $('replyText').value = '';
        $('replyFiles').value = '';
        updateFileList('replyFiles', 'replyFileList');
        setSelectedHeader(data.thread);
        renderMessages(data.thread);
        renderUserInfo(data.thread?.userInfo);
        await loadThreads();
        showToast('DM gesendet.');
      } catch (error) {
        showToast(error.message, true);
      } finally {
        $('replyBtn').disabled = !state.selectedUserId;
      }
    }

    async function sendNewDm() {
      const userId = $('newUserId').value.trim();
      const content = $('newMessage').value.trim();
      const attachments = await readAttachments('newFiles');
      if (!userId || (!content && !attachments.length)) {
        return showToast('User-ID und Nachricht oder Anhang eintragen.', true);
      }

      $('newSendBtn').disabled = true;
      try {
        const data = await api('/api/dashboard/dm', {
          method: 'POST',
          body: { userId, content, attachments }
        });
        $('newMessage').value = '';
        $('newFiles').value = '';
        updateFileList('newFiles', 'newFileList');
        state.selectedUserId = userId;
        setSelectedHeader(data.thread);
        renderMessages(data.thread);
        renderUserInfo(data.thread?.userInfo);
        await loadThreads();
        showToast('DM gesendet.');
      } catch (error) {
        showToast(error.message, true);
      } finally {
        $('newSendBtn').disabled = false;
      }
    }

    async function toggleArchive() {
      if (!state.selectedUserId || !state.selectedThread) return;
      const archived = !state.selectedThread.archived;

      try {
        const data = await api(`/api/dashboard/threads/${encodeURIComponent(state.selectedUserId)}`, {
          method: 'PATCH',
          body: { archived }
        });
        setSelectedHeader(data.thread);
        renderMessages(data.thread);
        renderUserInfo(data.thread?.userInfo);
        await loadThreads();
        showToast(archived ? 'Thread archiviert.' : 'Thread wiederhergestellt.');
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function deleteThread() {
      if (!state.selectedUserId) return;
      const ok = confirm('Diesen DM-Thread wirklich löschen? Neue DMs vom User legen später wieder einen Thread an.');
      if (!ok) return;

      try {
        await api(`/api/dashboard/threads/${encodeURIComponent(state.selectedUserId)}`, {
          method: 'DELETE'
        });
        clearSelection();
        await loadThreads();
        showToast('Thread gelöscht.');
      } catch (error) {
        showToast(error.message, true);
      }
    }

    function sendOnEnter(event, sendFn) {
      if (event.key !== 'Enter' || event.shiftKey) return;
      event.preventDefault();
      sendFn().catch(error => showToast(error.message, true));
    }

    async function login(event) {
      event.preventDefault();
      const password = $('passwordInput').value;
      try {
        await api('/api/dashboard/login', {
          method: 'POST',
          noAuth: true,
          body: { password }
        });
        state.token = password;
        localStorage.setItem('hugoDmDashboardToken', password);
        $('loginView').classList.add('hidden');
        $('appView').classList.remove('hidden');
        await loadThreads();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function boot() {
      try {
        const status = await api('/api/dashboard/status', { noAuth: true });
        $('botName').textContent = status.bot;

        if (!status.configured) {
          $('loginHint').textContent = 'DASHBOARD_PASSWORD ist in Railway noch nicht gesetzt.';
          $('loginView').classList.remove('hidden');
          return;
        }

        if (state.token) {
          $('appView').classList.remove('hidden');
          await loadThreads();
        } else {
          $('loginView').classList.remove('hidden');
        }
      } catch (error) {
        state.token = '';
        localStorage.removeItem('hugoDmDashboardToken');
        $('appView').classList.add('hidden');
        $('loginHint').textContent = 'Dashboard konnte nicht geladen werden.';
        $('loginView').classList.remove('hidden');
        showToast(error.message, true);
      }
    }

    $('loginForm').addEventListener('submit', login);
    $('refreshBtn').addEventListener('click', () => refreshDashboard().catch(error => showToast(error.message, true)));
    $('replyBtn').addEventListener('click', () => sendReply().catch(error => showToast(error.message, true)));
    $('newSendBtn').addEventListener('click', () => sendNewDm().catch(error => showToast(error.message, true)));
    $('replyText').addEventListener('keydown', event => sendOnEnter(event, sendReply));
    $('newMessage').addEventListener('keydown', event => sendOnEnter(event, sendNewDm));
    $('replyFiles').addEventListener('change', () => updateFileList('replyFiles', 'replyFileList'));
    $('newFiles').addEventListener('change', () => updateFileList('newFiles', 'newFileList'));
    $('archiveBtn').addEventListener('click', toggleArchive);
    $('deleteThreadBtn').addEventListener('click', deleteThread);
    $('threadSearch').addEventListener('input', () => {
      state.search = $('threadSearch').value.trim();
      clearTimeout(loadThreads.searchTimer);
      loadThreads.searchTimer = setTimeout(() => loadThreads().catch(error => showToast(error.message, true)), 180);
    });
    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(item => {
          item.classList.toggle('active', item === button);
        });
        loadThreads().catch(error => showToast(error.message, true));
      });
    });
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('hugoDmDashboardToken');
      location.reload();
    });
    $('copyIdBtn').addEventListener('click', () => {
      if (!state.selectedUserId) return;
      navigator.clipboard?.writeText(state.selectedUserId);
      showToast('User-ID kopiert.');
    });

    setInterval(() => {
      if (!state.token || $('appView').classList.contains('hidden')) return;
      refreshDashboard().catch(() => {});
    }, 15000);

    boot();
  </script>
</body>
</html>
