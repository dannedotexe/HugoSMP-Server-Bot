<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugoSMP Market</title>
  <meta name="description" content="HugoSMP Market – Ingame-Geld, Spawner und Items für HugoSMP. Bestellung direkt per Discord-Ticket.">
  <link rel="icon" href="/assets/dashboard-icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --text: #fbf7ef;
      --muted: rgba(251, 247, 239, .72);
      --soft: rgba(251, 247, 239, .5);
      --glass: rgba(18, 13, 10, .62);
      --glass-2: rgba(30, 22, 16, .72);
      --line: rgba(255, 236, 200, .14);
      --line-strong: rgba(255, 236, 200, .28);
      --gold: #f6c544;
      --gold-deep: #c9921c;
      --green: #4ade5a;
      --green-deep: #1f8f2c;
      --blurple: #5865f2;
      --danger: #ff6b6b;
      --pixel: "Silkscreen", "Courier New", monospace;
      --radius: 14px;
      --shadow: 0 24px 60px rgba(0, 0, 0, .5);
      font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #1a120d;
      color: var(--text);
      line-height: 1.5;
    }

    /* Minecraft scene, blurred + darkened. Drop your own screenshot at assets/shop-bg.jpg to override. */
    .scene {
      position: fixed; inset: -24px; z-index: -2;
      background-image: url("/assets/shop-bg.jpg"), url("/assets/shop-bg.svg");
      background-size: cover; background-position: center;
      filter: blur(3px) saturate(1.05);
    }
    .scene::after {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(10, 6, 4, .25), rgba(10, 6, 4, .7) 75%),
        linear-gradient(180deg, rgba(20, 12, 30, .35), rgba(12, 8, 5, .55));
    }

    a { color: inherit; }
    button, input, textarea, select { font: inherit; color: inherit; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
    .pixel { font-family: var(--pixel); letter-spacing: .04em; }

    /* ── Top bar ─────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; transition: background .2s, border-color .2s;
      border-bottom: 1px solid transparent;
    }
    .topbar.solid { background: rgba(14, 10, 7, .82); backdrop-filter: blur(12px); border-color: var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; image-rendering: pixelated; }
    .brand span { font-family: var(--pixel); font-size: 15px; }
    .brand b { color: var(--gold); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
      background: rgba(10, 8, 6, .72); border: 1px solid var(--line); font-weight: 700; font-size: 14px;
      text-decoration: none; white-space: nowrap;
    }
    .chip em { font-style: normal; color: var(--green); }
    .chip:hover { border-color: var(--line-strong); }

    .lang { display: inline-flex; gap: 4px; }
    .lang button {
      font-family: var(--pixel); font-size: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
      background: rgba(10, 8, 6, .72); border: 1px solid var(--line); color: var(--muted);
    }
    .lang button.active { background: var(--green); border-color: var(--green); color: #0b2a0f; }

    .cart-btn {
      position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
      background: rgba(10, 8, 6, .72); border: 1px solid var(--line); cursor: pointer; font-weight: 700;
    }
    .cart-btn:hover { border-color: var(--gold); }
    .cart-count {
      position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
      background: var(--gold); color: #2a1b00; font-size: 12px; font-weight: 800; display: grid; place-items: center;
    }
    .cart-count[hidden] { display: none; }

    /* ── Hero ────────────────────────────────────── */
    .hero {
      min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center;
      padding: 110px 20px 70px;
    }
    .hero-inner { max-width: 760px; }
    .eyebrow { font-family: var(--pixel); color: var(--gold); font-size: 13px; letter-spacing: .32em; text-transform: uppercase; }
    .title {
      font-family: var(--pixel); font-weight: 700; font-size: clamp(54px, 12vw, 128px); line-height: 1; margin: 22px 0 18px;
      color: #fff; letter-spacing: .04em;
      text-shadow: 0 0 2px #fff, 5px 5px 0 #3d3d3d, 0 0 40px rgba(255, 255, 255, .25);
    }
    .lead { font-size: clamp(17px, 2.2vw, 20px); color: var(--muted); margin: 0 auto; max-width: 620px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
    .lead strong { color: #fff; }
    .lead u { text-decoration-color: var(--green); text-underline-offset: 4px; text-decoration-thickness: 2px; color: #fff; }
    .checks { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; margin: 24px 0 26px; font-size: 15px; color: var(--muted); }
    .checks span::before { content: "✓"; color: var(--green); font-weight: 800; margin-right: 6px; }

    .cta { display: flex; justify-content: center; align-items: stretch; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 22px; border-radius: 10px;
      border: 1px solid var(--line-strong); background: var(--glass-2); font-weight: 700; font-size: 16px; cursor: pointer;
      text-decoration: none; transition: transform .12s, filter .12s, border-color .12s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(2px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
    .btn-discord { background: var(--blurple); border-color: transparent; color: #fff; font-size: 18px; box-shadow: 0 6px 0 #3c45b5, 0 12px 30px rgba(88, 101, 242, .35); }
    .btn-discord:active { box-shadow: 0 4px 0 #3c45b5; }
    .btn-discord svg { width: 22px; height: 22px; }
    .btn-gold { background: var(--gold); border-color: transparent; color: #2a1b00; box-shadow: 0 5px 0 var(--gold-deep); }
    .btn-gold:active { box-shadow: 0 3px 0 var(--gold-deep); }
    .btn-green { background: var(--green); border-color: transparent; color: #0b2a0f; box-shadow: 0 5px 0 var(--green-deep); }
    .btn-green:active { box-shadow: 0 3px 0 var(--green-deep); }
    .btn-green:disabled { box-shadow: none; }

    .reward {
      display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px;
      background: rgba(8, 20, 10, .72); border: 1px solid rgba(74, 222, 90, .45); text-decoration: none; font-weight: 700;
    }
    .reward .pixel { color: var(--green); font-size: 17px; font-weight: 700; }
    .reward small { color: var(--soft); font-weight: 500; }

    .giveaway {
      display: none; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; text-align: left;
      margin: 28px auto 0; max-width: 470px; padding: 16px 18px; border-radius: 16px;
      background: rgba(22, 16, 8, .78); border: 1px solid rgba(246, 197, 68, .55); box-shadow: 0 0 0 1px rgba(0,0,0,.4), var(--shadow);
    }
    .giveaway.show { display: grid; }
    .gw-icon {
      width: 60px; height: 60px; display: grid; place-items: center; font-size: 34px;
      background: radial-gradient(circle, rgba(74, 222, 90, .35), transparent 70%);
    }
    .gw-label { font-family: var(--pixel); color: var(--gold); font-size: 11px; letter-spacing: .25em; }
    .gw-prize { font-family: var(--pixel); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 2px 0; }
    .gw-prize .hl { color: var(--green); }
    .gw-sub { font-size: 13px; color: var(--muted); line-height: 1.35; }
    .gw-time { font-family: var(--pixel); color: #fff; }

    .scroll-hint { margin-top: 40px; font-family: var(--pixel); font-size: 12px; color: var(--soft); text-decoration: none; display: inline-block; animation: bob 2s infinite; }
    @keyframes bob { 50% { transform: translateY(6px); } }

    /* ── Sections ────────────────────────────────── */
    .panel {
      background: rgba(14, 10, 7, .78); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
    }
    section { padding: 64px 0; }
    section + section { border-top: 1px solid var(--line); }
    .head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
    .head .eyebrow { font-size: 11px; }
    .head h2 { font-family: var(--pixel); font-size: clamp(26px, 4vw, 36px); margin: 6px 0 0; line-height: 1.1; }
    .head p { margin: 6px 0 0; color: var(--muted); }

    .sale {
      display: none; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; padding: 14px 18px; border-radius: 12px;
      background: rgba(246, 197, 68, .1); border: 1px dashed rgba(246, 197, 68, .55);
    }
    .sale.show { display: flex; }
    .sale .tag { font-family: var(--pixel); background: var(--gold); color: #2a1b00; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
    .sale p { margin: 0; color: var(--muted); }
    .sale strong { color: #fff; }

    .search {
      background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; min-width: 260px; outline: none;
    }
    .search:focus { border-color: var(--gold); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 14px; transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(246, 197, 68, .45); box-shadow: var(--shadow); }
    .card.soldout { opacity: .55; }
    /* Minecraft inventory slot */
    .slot {
      height: 128px; display: grid; place-items: center; border-radius: 4px;
      background: #8b8b8b;
      box-shadow: inset 4px 4px 0 #373737, inset -4px -4px 0 #ffffff, 0 0 0 3px #1f1f1f;
    }
    .slot img { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.35)); }
    .slot .fallback { font-size: 44px; }
    .card h3 { margin: 0; font-size: 18px; font-weight: 700; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .price { font-family: var(--pixel); font-weight: 700; font-size: 22px; color: var(--gold); }
    .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
    .badge.ok { color: var(--green); border-color: rgba(74, 222, 90, .45); background: rgba(74, 222, 90, .08); }
    .badge.low { color: var(--gold); border-color: rgba(246, 197, 68, .45); background: rgba(246, 197, 68, .08); }
    .badge.out { color: var(--danger); border-color: rgba(255, 107, 107, .45); background: rgba(255, 107, 107, .08); }

    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.3); }
    .qty button { width: 34px; height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 18px; }
    .qty button:hover { background: rgba(255,255,255,.08); }
    .qty input { width: 48px; height: 40px; border: 0; background: transparent; text-align: center; outline: none; -moz-appearance: textfield; }
    .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .actions { display: flex; gap: 8px; margin-top: auto; }
    .actions .btn { flex: 1; padding: 10px 12px; font-size: 15px; white-space: nowrap; }

    .skeleton { height: 300px; border-radius: var(--radius); background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.09), rgba(255,255,255,.04)); background-size: 200% 100%; animation: sh 1.4s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    .notice { padding: 22px; border-radius: var(--radius); border: 1px dashed var(--line-strong); color: var(--muted); text-align: center; grid-column: 1 / -1; }

    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .step { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .step .num { font-family: var(--pixel); font-weight: 700; font-size: 26px; color: var(--green); }
    .step h3 { margin: 8px 0 6px; font-size: 18px; }
    .step p { margin: 0; color: var(--muted); }

    .perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .perk { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .perk .big { font-family: var(--pixel); font-weight: 700; font-size: 26px; }
    .perk.green .big { color: var(--green); }
    .perk.pink .big { color: #f47fff; }
    .perk p { color: var(--muted); margin: 8px 0 0; }

    details { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px; margin-bottom: 10px; }
    summary { cursor: pointer; font-weight: 700; }
    details p { color: var(--muted); margin: 10px 0 0; }

    footer { border-top: 1px solid var(--line); padding: 26px 0; color: var(--soft); font-size: 14px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    /* ── Drawer ──────────────────────────────────── */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); z-index: 50;
      background: #17110c; border-left: 1px solid var(--line); box-shadow: var(--shadow);
      transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
    }
    .drawer.open { transform: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; font-family: var(--pixel); font-size: 20px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; font-size: 18px; }
    .drawer-body { flex: 1; overflow: auto; padding: 18px 20px; }
    .drawer-foot { border-top: 1px solid var(--line); padding: 18px 20px; }

    .line-item { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .line-item .mini { width: 48px; height: 48px; display: grid; place-items: center; background: #8b8b8b; box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff; border-radius: 2px; }
    .line-item .mini img { width: 34px; height: 34px; object-fit: contain; image-rendering: pixelated; }
    .line-item .mini .fallback { font-size: 24px; }
    .line-item .name { font-weight: 700; }
    .line-item .sub { color: var(--soft); font-size: 13px; }
    .line-item .qty button { width: 28px; height: 32px; font-size: 15px; }
    .line-item .qty input { width: 38px; height: 32px; font-size: 14px; }
    .remove { background: none; border: 0; color: var(--soft); cursor: pointer; font-size: 13px; padding: 0; margin-top: 2px; }
    .remove:hover { color: var(--danger); }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 18px; margin-bottom: 14px; }
    .total-row .pixel { color: var(--gold); font-size: 22px; }

    form label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
    form input, form select, form textarea { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; }
    form select option { background: #17110c; }
    form input:focus, form select:focus, form textarea:focus { border-color: var(--gold); }
    form textarea { resize: vertical; min-height: 72px; }
    .hint { font-size: 12px; color: var(--soft); margin-top: 5px; }
    .error { color: var(--danger); font-size: 14px; margin: 12px 0 0; }
    .success { text-align: center; padding: 30px 6px; }
    .success .big { font-size: 52px; }
    .success h3 { font-family: var(--pixel); margin: 8px 0; font-size: 22px; }
    .success p { color: var(--muted); }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 60;
      background: #17110c; border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; font-weight: 600;
      transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      .topbar { padding: 10px 16px; }
      .chip.booster, .brand span { display: none; }
      .wrap { padding: 0 16px; }
      .hero { padding-left: 16px; padding-right: 16px; }
      .giveaway { grid-template-columns: auto 1fr; }
      .giveaway .btn { grid-column: 1 / -1; }
      .search { min-width: 0; width: 100%; }
      .cta > * { width: 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top">
      <img src="/assets/dashboard-icon.jpg" alt="">
      <span>HugoSMP <b>Market</b></span>
    </a>
    <div class="top-actions">
      <a class="chip booster" href="#perks" data-i18n-html="boosterChip"></a>
      <div class="lang" role="group" aria-label="Sprache">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button class="cart-btn" id="openCart" type="button">
        🛒 <span data-i18n="cart"></span>
        <span class="cart-count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="top">
    <div class="hero">
      <div class="hero-inner">
        <div class="eyebrow">HugoSMP Market · <span data-i18n="eyebrow"></span></div>
        <h1 class="title">SHOP</h1>
        <p class="lead" data-i18n-html="lead"></p>
        <div class="checks">
          <span data-i18n="check1"></span>
          <span data-i18n="check2"></span>
          <span data-i18n="check3"></span>
        </div>
        <div class="cta">
          <a class="btn btn-discord" id="discordBtn" href="#faq" target="_blank" rel="noopener" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1A19.8 19.8 0 0 0 6.1 21l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-2.9c.5-5.2-.8-9.7-3.6-13.7ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
            <span id="discordLabel">Discord</span>
          </a>
          <a class="btn btn-gold" href="#produkte" data-i18n="shopNow"></a>
          <a class="reward" href="#perks">
            <span class="pixel" id="rewardAmount">5M</span>
            <span id="rewardLabel"></span>
            <small>Invite Rewards</small>
          </a>
        </div>

        <div class="giveaway" id="giveaway">
          <div class="gw-icon">🎁</div>
          <div>
            <div class="gw-label">GIVEAWAY</div>
            <div class="gw-prize" id="gwPrize"></div>
            <div class="gw-sub" id="gwSub"></div>
          </div>
          <a class="btn btn-gold" id="gwBtn" target="_blank" rel="noopener" data-i18n="join"></a>
        </div>

        <a class="scroll-hint" href="#produkte" data-i18n="scroll"></a>
      </div>
    </div>

    <div class="panel">
      <section id="produkte">
        <div class="wrap">
          <div class="sale" id="sale">
            <span class="tag" data-i18n="offer"></span>
            <p id="saleText"></p>
          </div>
          <div class="head">
            <div>
              <div class="eyebrow" data-i18n="liveStock"></div>
              <h2 data-i18n="products"></h2>
            </div>
            <input class="search" id="search" type="search" data-i18n-placeholder="search">
          </div>
          <div class="grid" id="grid">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </div>
      </section>

      <section id="ablauf">
        <div class="wrap">
          <div class="head"><div><div class="eyebrow" data-i18n="howEyebrow"></div><h2 data-i18n="howTitle"></h2></div></div>
          <div class="steps">
            <div class="step"><div class="num">01</div><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></div>
            <div class="step"><div class="num">02</div><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></div>
            <div class="step"><div class="num">03</div><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></div>
          </div>
        </div>
      </section>

      <section id="perks">
        <div class="wrap">
          <div class="head"><div><div class="eyebrow" data-i18n="perksEyebrow"></div><h2 data-i18n="perksTitle"></h2></div></div>
          <div class="perks">
            <div class="perk green"><div class="big" id="perkInvite">5M</div><p id="perkInviteText"></p></div>
            <div class="perk pink"><div class="big" id="perkBooster">2,5M</div><p data-i18n="perkBoosterText"></p></div>
            <div class="perk"><div class="big">🎁</div><p data-i18n="perkGiveawayText"></p></div>
          </div>
        </div>
      </section>

      <section id="faq">
        <div class="wrap">
          <div class="head"><div><div class="eyebrow">FAQ</div><h2 data-i18n="faqTitle"></h2></div></div>
          <details><summary data-i18n="q1"></summary><p data-i18n-html="a1"></p></details>
          <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
          <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
          <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
        </div>
      </section>

      <footer>
        <div class="wrap">
          <span>© <span id="year"></span> HugoSMP Market</span>
          <span data-i18n="disclaimer"></span>
        </div>
      </footer>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Warenkorb">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" id="closeCart" type="button" aria-label="Schließen">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot">
      <div class="total-row"><span data-i18n="total"></span><span class="pixel" id="cartTotal">0,00 €</span></div>
      <button class="btn btn-green" id="toCheckout" type="button" style="width:100%" data-i18n="checkout"></button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = '';
    const CART_KEY = 'hugosmp_cart';
    const LOW_STOCK = 5;

    const I18N = {

      },

        products: 'Products',
        search: 'Search products …',
        inStock: '{n} in stock',
        low: 'Only {n} left',
        soldOut: 'Sold out',
        add: 'Add to cart',
        added: '{name} added',
        noMore: 'No more in stock right now.',
        empty: 'No products available right now.',
        notFound: 'No product found.',
        loadFail: 'Could not load the shop. Please try again later.',
        howEyebrow: '3 steps',
        howTitle: 'How it works',
        s1t: 'Fill your cart', s1p: 'Pick products and amounts. Stock comes live from the bot.',
        s2t: 'Place your order', s2p: 'Enter your Discord ID – the bot opens a private ticket with your invoice.',
        s3t: 'Pay & receive', s3p: 'Pay in the ticket and a staff member delivers everything in-game.',
        perksEyebrow: 'Community',
        perksTitle: 'Rewards',
        perkInviteText: 'for {n} verified invites to our Discord. Get your link with /invite.',
        perkBoosterText: 'monthly booster bonus – plus ticket priority for every server booster.',
        perkGiveawayText: 'Regular giveaways on Discord. Just hit 🎉 to join.',
        faqTitle: 'Questions & answers',
        q1: 'Where do I find my Discord user ID?',
        a1: 'Discord → Settings → Advanced → enable <b>Developer Mode</b>. Then right-click (or long-press) your name → <b>Copy User ID</b>.',

        q3: 'Which payment methods are there?',
        a3: 'PayPal and Paysafecard. Other methods can be discussed with the team in your ticket.',
        q4: 'How fast do I get my items?',
        a4: 'As soon as the payment is confirmed a staff member delivers – usually very fast, depending on who is online.',
        disclaimer: 'Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.',
        total: 'Total',
        checkout: 'Checkout',
        checkoutTitle: 'Checkout',
        cartEmpty: 'Your cart is empty.',
        remove: 'Remove',
        discordId: 'Discord user ID',
        discordHint: 'Developer Mode on → right-click yourself → "Copy User ID". You must be on the Discord.',
        name: 'Name / Minecraft name',
        namePh: 'Your in-game name',
        payment: 'Payment method',
        payOther: 'Other (discuss in ticket)',
        note: 'Note (optional)',
        notePh: 'When are you online? Special requests?',
        back: 'Back',
        submit: 'Place order',
        sending: 'Sending …',
        errId: 'Please enter a valid Discord user ID (17–20 digits).',
        errName: 'Please enter your name.',
        errEmpty: 'Your cart is empty.',
        errFail: 'Order failed.',
        errNet: 'Server unreachable. Please try again in a moment.',
        openTicket: 'Open ticket',
        doneTitle: 'Ordered!',
        doneH: 'Order received',
        doneP: 'Your ticket with the invoice was created on Discord. Pay there and a staff member will get back to you.',
        doneBtn: 'Open ticket on Discord'
      }
    };

    const state = { items: [], cart: loadCart(), view: 'cart', query: '', community: null, lang: loadLang() };
    const $ = id => document.getElementById(id);

    function loadLang() {
      try { const l = localStorage.getItem('hugosmp_lang'); if (l === 'de' || l === 'en') return l; } catch {}
      return (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
    }
    function t(key, vars = {}) {
      const str = (I18N[state.lang] && I18N[state.lang][key]) ?? I18N.de[key] ?? key;
      return str.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    }
    const locale = () => (state.lang === 'de' ? 'de-DE' : 'en-GB');
    const money = n => n.toLocaleString(locale(), { style: 'currency', currency: 'EUR' });
    const num = n => n.toLocaleString(locale());

    function applyLang() {
      document.documentElement.lang = state.lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      renderCommunity();
      renderOffer();
      if (state.items.length) renderGrid();
      if (state.view === 'checkout') renderCheckout(); else if (state.view === 'cart') renderCart();
    }

    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
      state.lang = b.dataset.lang;
      try { localStorage.setItem('hugosmp_lang', state.lang); } catch {}
      applyLang();
    }));

    function loadCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch { return {}; }
    }
    function saveCart() {
      try { localStorage.setItem(CART_KEY, JSON.stringify(state.cart)); } catch {}
    }

    function parsePrice(text) {
      const match = String(text || '').replace(/\s/g, '').match(/[\d.,]+/);
      if (!match) return 0;
      let value = match[0];
      if (value.includes(',')) value = value.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(value);
      return Number.isFinite(n) ? n : 0;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function emojiId(item) {
      if (item.emojiId) return item.emojiId;
      const m = String(item.emoji || '').match(/:(\d{17,20})>/);
      return m ? m[1] : null;
    }

    function itemImage(item) {
      const id = emojiId(item);
      if (id) return `<img src="https://cdn.discordapp.com/emojis/${id}.png?size=128" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'📦'}))">`;
      const plain = String(item.emoji || '').trim();
      return `<span class="fallback">${plain && !plain.startsWith('<') ? escapeHtml(plain) : '📦'}</span>`;
    }

    function badge(amount) {
      if (amount <= 0) return `<span class="badge out">${t('soldOut')}</span>`;
      if (amount <= LOW_STOCK) return `<span class="badge low">${t('low', { n: amount })}</span>`;
      return `<span class="badge ok">${t('inStock', { n: num(amount) })}</span>`;
    }

    function toast(text) {
      const el = $('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function clampQty(id, qty) {
      const item = state.items.find(i => i.id === id);
      const max = item ? Math.max(0, item.amount) : 0;
      return Math.max(0, Math.min(max, Math.floor(Number(qty) || 0)));
    }

    // ── Community (hero) ──────────────────────────
    function shortReward(text) {
      const m = String(text || '').match(/([\d.,]+\s*[kKmM])\b/);
      return m ? m[1].replace(/\s/g, '').toUpperCase() : String(text || '');
    }

    function timeLeft(ms) {
      const m = Math.max(0, Math.floor(ms / 60000));
      const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${mm}m`;
      return `${mm}m`;
    }

    function renderCommunity() {
      const c = state.community || {};
      const invites = c.requiredInvites || 8;
      $('rewardLabel').textContent = t('perInvites', { n: invites });
      $('perkInviteText').textContent = t('perkInviteText', { n: invites });
      if (c.inviteReward) {
        $('rewardAmount').textContent = shortReward(c.inviteReward);
        $('perkInvite').textContent = shortReward(c.inviteReward);
      }
      if (c.boosterReward) $('perkBooster').textContent = shortReward(c.boosterReward);

      if (c.discordInvite) {
        $('discordBtn').href = c.discordInvite;
        $('discordLabel').textContent = c.discordInvite.replace(/^https?:\/\//, '');
        $('discordBtn').hidden = false;
      }

      const gw = c.giveaway;
      if (gw && gw.endTime > Date.now()) {
        $('gwPrize').innerHTML = escapeHtml(gw.prize).replace(/^([\d.,]+\s*[kKmM]?\b)/, '<span class="hl">$1</span>');
        $('gwSub').innerHTML = t('gwSub', { t: `<span class="gw-time">${timeLeft(gw.endTime - Date.now())}</span>`, p: num(gw.participants || 0) });
        $('gwBtn').href = gw.url;
        $('giveaway').classList.add('show');
      } else {
        $('giveaway').classList.remove('show');
      }
    }

    function renderOffer() {
      const o = state.offer;
      if (!o) { $('sale').classList.remove('show'); return; }
      $('saleText').innerHTML =
        `<strong>${escapeHtml(o.title)}</strong>` +
        (o.discount ? ` – ${escapeHtml(o.discount)}` : '') +
        (o.until ? ` · ${t('until')} ${escapeHtml(o.until)}` : '') +
        (o.description ? `<br>${escapeHtml(o.description)}` : '');
      $('sale').classList.add('show');
    }

    // ── Products ───────────────────────────────────
    function renderGrid() {
      const grid = $('grid');
      const q = state.query.trim().toLowerCase();
      const list = state.items.filter(i => !q || i.name.toLowerCase().includes(q));

      if (!state.items.length) { grid.innerHTML = `<div class="notice">${t('empty')}</div>`; return; }
      if (!list.length) { grid.innerHTML = `<div class="notice">${t('notFound')}</div>`; return; }

      grid.innerHTML = list.map(item => {
        const out = item.amount <= 0;
        const dis = out ? 'disabled' : '';
        return `
          <article class="card ${out ? 'soldout' : ''}" data-id="${escapeHtml(item.id)}">
            <div class="slot">${itemImage(item)}</div>
            <h3>${escapeHtml(item.name)}</h3>
            <div class="row">
              <span class="price">${escapeHtml(item.price)}</span>
              ${badge(item.amount)}
            </div>
            <div class="actions">
              <div class="qty">
                <button type="button" data-step="-1" aria-label="-" ${dis}>−</button>
                <input type="number" min="1" max="${item.amount}" value="1" aria-label="Menge" ${dis}>
                <button type="button" data-step="1" aria-label="+" ${dis}>+</button>
              </div>
              <button class="btn btn-green" type="button" data-add ${dis}>${out ? t('soldOut') : t('add')}</button>
            </div>
          </article>`;
      }).join('');
    }

    $('grid').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const id = card.dataset.id;
      const input = card.querySelector('.qty input');
      const item = state.items.find(i => i.id === id);
      if (!item) return;

      const step = e.target.closest('[data-step]');
      if (step) {
        input.value = Math.max(1, Math.min(item.amount, (Number(input.value) || 1) + Number(step.dataset.step)));
        return;
      }

      if (e.target.closest('[data-add]')) {
        const qty = clampQty(id, (state.cart[id] || 0) + Math.max(1, Number(input.value) || 1));
        if (qty <= (state.cart[id] || 0)) { toast(t('noMore')); return; }
        state.cart[id] = qty;
        saveCart();
        renderCart();
        toast(t('added', { name: item.name }));
      }
    });

    $('search').addEventListener('input', e => { state.query = e.target.value; renderGrid(); });

    // ── Cart ───────────────────────────────────────
    function cartLines() {
      return Object.entries(state.cart)
        .map(([id, qty]) => {
          const item = state.items.find(i => i.id === id);
          return item && qty > 0 ? { item, qty, sum: parsePrice(item.price) * qty } : null;
        })
        .filter(Boolean);
    }
    const cartTotal = () => cartLines().reduce((acc, l) => acc + l.sum, 0);

    function renderCart() {
      const lines = cartLines();
      const count = lines.reduce((acc, l) => acc + l.qty, 0);
      $('cartCount').textContent = count;
      $('cartCount').hidden = count === 0;
      $('cartTotal').textContent = money(cartTotal());
      $('toCheckout').disabled = lines.length === 0;

      if (state.view !== 'cart') return;
      $('drawerTitle').textContent = t('cart');
      $('drawerFoot').style.display = '';

      if (!lines.length) { $('drawerBody').innerHTML = `<div class="notice">${t('cartEmpty')}</div>`; return; }

      $('drawerBody').innerHTML = lines.map(({ item, qty, sum }) => `
        <div class="line-item" data-id="${escapeHtml(item.id)}">
          <div class="mini">${itemImage(item)}</div>
          <div>
            <div class="name">${escapeHtml(item.name)}</div>
            <div class="sub">${escapeHtml(item.price)} · ${money(sum)}</div>
            <button class="remove" type="button" data-remove>${t('remove')}</button>
          </div>
          <div class="qty">
            <button type="button" data-step="-1" aria-label="-">−</button>
            <input type="number" min="1" max="${item.amount}" value="${qty}" aria-label="Menge">
            <button type="button" data-step="1" aria-label="+">+</button>
          </div>
        </div>`).join('');
    }

    $('drawerBody').addEventListener('click', e => {
      const line = e.target.closest('.line-item');
      if (!line) return;
      const id = line.dataset.id;
      if (e.target.closest('[data-remove]')) {
        delete state.cart[id];
      } else {
        const step = e.target.closest('[data-step]');
        if (!step) return;
        const qty = clampQty(id, (state.cart[id] || 0) + Number(step.dataset.step));
        if (qty <= 0) delete state.cart[id]; else state.cart[id] = qty;
      }
      saveCart();
      renderCart();
    });

    $('drawerBody').addEventListener('change', e => {
      const line = e.target.closest('.line-item');
      if (!line || !e.target.matches('.qty input')) return;
      const qty = clampQty(line.dataset.id, e.target.value);
      if (qty <= 0) delete state.cart[line.dataset.id]; else state.cart[line.dataset.id] = qty;
      saveCart();
      renderCart();
    });

    function openDrawer() {
      state.view = 'cart';
      renderCart();
      $('drawer').classList.add('open');
      $('overlay').classList.add('open');
    }
    function closeDrawer() {
      $('drawer').classList.remove('open');
      $('overlay').classList.remove('open');
    }
    $('openCart').addEventListener('click', openDrawer);
    $('closeCart').addEventListener('click', closeDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    // ── Checkout ───────────────────────────────────
    function renderCheckout() {
      const prev = {
        discordId: document.getElementById('discordId')?.value,
        username: document.getElementById('username')?.value,
        note: document.getElementById('note')?.value,
        payment: document.getElementById('paymentMethod')?.value
      };
      state.view = 'checkout';
      $('drawerTitle').textContent = t('checkoutTitle');
      $('drawerFoot').style.display = 'none';
      const saved = (() => { try { return JSON.parse(localStorage.getItem('hugosmp_buyer')) || {}; } catch { return {}; } })();

      $('drawerBody').innerHTML = `
        <form id="checkout" novalidate>
          <div class="total-row"><span>${t('total')}</span><span class="pixel">${money(cartTotal())}</span></div>
          <label for="discordId">${t('discordId')}</label>
          <input id="discordId" inputmode="numeric" autocomplete="off" placeholder="123456789012345678" value="${escapeHtml(prev.discordId ?? saved.discordId ?? '')}" required>
          <div class="hint">${escapeHtml(t('discordHint'))}</div>
          <label for="username">${t('name')}</label>
          <input id="username" autocomplete="nickname" placeholder="${escapeHtml(t('namePh'))}" value="${escapeHtml(prev.username ?? saved.username ?? '')}" required>
          <label for="paymentMethod">${t('payment')}</label>
          <select id="paymentMethod">
            <option value="PayPal">PayPal</option>
            <option value="Paysafecard">Paysafecard</option>
            <option value="Andere (im Ticket klären)">${t('payOther')}</option>
          </select>
          <label for="note">${t('note')}</label>
          <textarea id="note" maxlength="500" placeholder="${escapeHtml(t('notePh'))}">${escapeHtml(prev.note || '')}</textarea>
          <p class="error" id="formError"></p>
          <div style="display:flex; gap:10px; margin-top:16px">
            <button class="btn" type="button" id="backToCart">${t('back')}</button>
            <button class="btn btn-green" type="submit" id="submitOrder" style="flex:1">${t('submit')}</button>
          </div>
        </form>`;

      if (prev.payment) $('paymentMethod').value = prev.payment;
      $('backToCart').addEventListener('click', () => { state.view = 'cart'; renderCart(); });
      $('checkout').addEventListener('submit', submitOrder);
    }
    $('toCheckout').addEventListener('click', renderCheckout);

    async function submitOrder(e) {
      e.preventDefault();
      const err = $('formError');
      const discordId = $('discordId').value.trim();
      const username = $('username').value.trim();
      err.textContent = '';

      if (!/^\d{17,20}$/.test(discordId)) { err.textContent = t('errId'); return; }
      if (username.length < 2) { err.textContent = t('errName'); return; }
      const lines = cartLines();
      if (!lines.length) { err.textContent = t('errEmpty'); return; }

      const btn = $('submitOrder');
      btn.disabled = true;
      btn.textContent = t('sending');

      try {
        try { localStorage.setItem('hugosmp_buyer', JSON.stringify({ discordId, username })); } catch {}
        const res = await fetch(`${API_BASE}/api/order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            discordId,
            username,
            paymentMethod: $('paymentMethod').value,
            note: $('note').value.trim(),
            total: cartTotal().toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }),
            items: lines.map(l => ({ id: l.item.id, name: l.item.name, quantity: l.qty, price: l.item.price }))
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          err.innerHTML = escapeHtml(data.error || t('errFail')) +
            (data.ticketUrl ? ` <a href="${escapeHtml(data.ticketUrl)}" target="_blank" rel="noopener">${t('openTicket')}</a>` : '');
          return;
        }

        state.cart = {};
        saveCart();
        state.view = 'done';
        renderCart();
        $('drawerTitle').textContent = t('doneTitle');
        $('drawerBody').innerHTML = `
          <div class="success">
            <div class="big">🎉</div>
            <h3>${t('doneH')}</h3>
            <p>${t('doneP')}</p>
            <a class="btn btn-discord" href="${escapeHtml(data.ticketUrl)}" target="_blank" rel="noopener">${t('doneBtn')}</a>
          </div>`;
      } catch {
        err.textContent = t('errNet');
      } finally {
        if (document.body.contains(btn)) {
          btn.disabled = false;
          btn.textContent = t('submit');
        }
      }
    }

    // ── Load ───────────────────────────────────────
    async function loadStock() {
      try {
        const res = await fetch(`${API_BASE}/api/stock`, { cache: 'no-store' });
        const data = await res.json();
        if (!data.success) throw new Error();
        state.items = (data.stock || []).map(i => ({ ...i, amount: Number(i.amount) || 0 }));
        state.community = data.community || null;
        state.offer = data.offer || null;

        for (const id of Object.keys(state.cart)) {
          const qty = clampQty(id, state.cart[id]);
          if (qty <= 0) delete state.cart[id]; else state.cart[id] = qty;
        }
        saveCart();

        renderOffer();
        renderCommunity();
        renderGrid();
        if (state.view === 'cart') renderCart();
      } catch {
        $('grid').innerHTML = `<div class="notice">${t('loadFail')}</div>`;
      }
    }

    const topbar = $('topbar');
    const onScroll = () => topbar.classList.toggle('solid', window.scrollY > 40);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    $('year').textContent = new Date().getFullYear();
    applyLang();
    loadStock();
    setInterval(() => { if (state.view === 'cart') loadStock(); }, 60000);
  </script>
</body>
</html>
